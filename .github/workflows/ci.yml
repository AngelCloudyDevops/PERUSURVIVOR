name: CI
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-test:
    name: Validación rápida y artefacto de release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Check release budget
        if: github.event_name == 'push'
        run: npm run release:budget
      - name: Test deployment receiver
        run: python3 -m unittest discover -s tests/deployment -p "test_*.py"
      - name: Preserve the tested release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: actions/upload-artifact@v7
        with:
          name: perusurvivor-release-${{ github.sha }}
          path: |
            dist
            ops/hostinger/known_hosts
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  deploy:
    name: Deploy PERUSURVIVOR (${{ github.ref_name }})
    needs: full-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && vars.PERUSURVIVOR_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.ref_name == 'main' && 'perusurvivor-production' || 'perusurvivor-staging' }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: perusurvivor-release-${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check this is still the latest branch commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const response = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/branches/' + process.env.GITHUB_REF_NAME, {
              headers: {Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json'}
            });
            if (!response.ok) throw new Error('Cannot verify branch: ' + response.status);
            const data = await response.json();
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'current=' + (data.commit.sha === process.env.GITHUB_SHA) + '\n');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Upload and atomically activate the game
        if: steps.latest.outputs.current == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.PERUSURVIVOR_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          key="$RUNNER_TEMP/perusurvivor-key"
          archive="$RUNNER_TEMP/perusurvivor-$GITHUB_SHA.tar.gz"
          trap 'rm -f "$key" "$archive"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          tar -cf - -C dist . | gzip -9 > "$archive"
          size=$(stat -c %s "$archive")
          limit=$((92 * 1024 * 1024))
          if [ "$size" -gt "$limit" ]; then
            echo "Release archive is $size bytes; limit is $limit" >&2
            exit 1
          fi
          command=deploy
          if [ "$GITHUB_REF_NAME" = staging ]; then command=deploy-staging; fi
          ssh -T -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=ops/hostinger/known_hosts \
            perusurvivor-deploy@179.236.77.159 "$command $GITHUB_SHA" < "$archive"
